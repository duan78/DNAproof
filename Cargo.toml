[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["adn"]
license = "MIT OR Apache-2.0"
rust-version = "1.94"

[workspace.dependencies]
# Erreurs et sérialisation
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Codes correcteurs et compression
reed-solomon = "0.2"
lz4_flex = "0.14"
zstd = "0.13.4"

# Hachage
sha2 = "0.10"

# Parallélisme
rayon = "1.8"

# Ligne de commande
clap = { version = "4.5", features = ["derive"] }

# Divers
uuid = { version = "1.0", features = ["v4", "serde"] }
jiff = { version = "1.0", default-features = false, features = ["std", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Tests
proptest = "1.5"
# Sans les graphiques : les mesures se lisent dans le terminal.
criterion = { version = "0.5", default-features = false }

[profile.release]
# Les codecs sont limités par le processeur : la compilation whole-program rapporte, et les
# binaires distribués n'ont pas besoin des symboles de débogage.
lto = "thin"
codegen-units = 1
strip = "debuginfo"
