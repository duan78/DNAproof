[package]
name = "adn-web"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Serveur HTTP. Sans les fonctionnalités que le serveur n'utilise pas — cookies, HTTP/2,
# compression des réponses, websockets, dépôt temporaire des envois — : ce sont autant de
# dépendances et de surfaces d'attaque en moins.
actix-web = { version = "4.20", default-features = false, features = ["macros", "unicode", "compat"] }
actix-files = "0.7"
actix-multipart = { version = "0.8", default-features = false }

# Pages
tera = "2"

# Sérialisation
serde = { workspace = true }
serde_json = { workspace = true }

# Tâches asynchrones
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

# Identifiants et dates
uuid = { workspace = true }
jiff = { workspace = true }

# Bibliothèques du projet
adn-core = { path = "../core" }
adn-storage = { path = "../storage" }

# Journaux
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-actix-web = "0.7"

# Corps des requêtes multipart
futures = "0.3"

# Configuration
config = { version = "0.15", default-features = false, features = ["toml"] }

[dev-dependencies]
# Le type des requêtes de bas niveau, pour écrire des helpers de test typés.
actix-http = "3"
